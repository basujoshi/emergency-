<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BD Danger Alert Viewer</title><style>*{box-sizing:border-box}body{margin:0;padding:14px;background:#f2f5fa;color:#172033;font:16px Arial}.wrap{max-width:950px;margin:auto}.hero{background:linear-gradient(135deg,#10284b,#155eef);color:white;padding:22px;border-radius:18px}.hero p{color:#dbeafe;line-height:1.5}.card,.room{background:white;border:1px solid #dce3ed;border-radius:15px;padding:17px;margin:13px 0;overflow-wrap:anywhere}label{display:block;font-weight:bold;margin:12px 0 6px}input,textarea,select,button{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}textarea{min-height:80px}button{background:#155eef;color:white;border:0;font-weight:bold;margin-top:9px;cursor:pointer}.secondary{background:#e8eef8;color:#183153}.danger{background:#c62828}.status{padding:12px;background:#eef4ff;border-radius:10px;margin:12px 0;line-height:1.45}.ok{background:#dcfae6;color:#05603a}.err{background:#fee4e2;color:#912018}.warn{background:#fff4d6;color:#854d0e}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.pill{display:inline-block;background:#e8eef8;border-radius:20px;padding:5px 9px;font-size:12px;font-weight:bold}.sos{border:2px solid #d92d20}.map{color:#155eef;font-weight:bold}.muted{font-size:13px;color:#667085;line-height:1.5}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:9px}.stat{background:#f6f8fc;border-radius:10px;padding:12px}.stat strong{display:block;font-size:22px}.stat span{font-size:12px;color:#667085}iframe{max-width:100%;border:0;border-radius:12px}@media(max-width:500px){body{padding:8px}.card,.room{padding:13px}}</style><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script></head><body><main class="wrap"><header class="hero"><span class="pill">BD DANGER ALERT</span><h1>Trusted Alert Viewer</h1><p>Enter the exact Room ID used on monitor.html. Data updates live.</p></header><section class="card"><div id="status" class="status">Connecting…</div><label>Room ID</label><input id="room" placeholder="Example: BD123"><div class="grid"><button id="connect">Connect to room</button><button id="disconnect" class="secondary">Disconnect</button></div></section><section id="details" class="card"><h2>Room details</h2><p>Enter a Room ID and connect.</p></section></main><script>const firebaseConfig = {
 apiKey:"AIzaSyBrVJ_vcLjxZMSZOjqUQocWjVf36GQ1bEw",
 authDomain:"king-59c08.firebaseapp.com",
 databaseURL:"https://king-59c08-default-rtdb.firebaseio.com",
 projectId:"king-59c08",
 storageBucket:"king-59c08.firebasestorage.app",
 messagingSenderId:"982382372976",
 appId:"1:982382372976:web:07758531a29fdd966e6cb5"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

const $=x=>document.getElementById(x);let current=null;
function status(t,c=''){$('status').className='status '+c;$('status').textContent=t}
function safe(v){return String(v==null||v===''?'Not provided':v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const clean=s=>s.trim().replace(/[.#$\[\]\/]/g,'_').slice(0,80);
db.ref('.info/connected').on('value',s=>{if(!s.val())status('Firebase disconnected — check internet and Rules.','err')});
$('connect').onclick=()=>{let raw=$('room').value.trim();if(!raw)return status('Enter Room ID first.','err');let key=clean(raw),path='bdDangerRooms/'+key;if(current){db.ref(current.path).off('value',current.fn);current=null}status('Connecting…');let ref=db.ref(path);let fn=ref.on('value',snap=>{if(!snap.exists()){$('details').innerHTML='<h2>Room not found</h2><p>Start monitoring first, then check that the Room ID is identical. Check Firebase Rules if the problem continues.</p>';status('Firebase connected, but no record exists for this Room ID.','err');return}let d=snap.val()||{},g=d.location||{},has=typeof g.latitude==='number'&&typeof g.longitude==='number'&&Number.isFinite(g.latitude)&&Number.isFinite(g.longitude);let map=has?`<p><b>Coordinates:</b> ${safe(g.latitude)}, ${safe(g.longitude)}</p><p><b>Accuracy:</b> ±${safe(g.accuracy)} m</p><p><b>GPS time:</b> ${g.gpsAt?safe(new Date(g.gpsAt).toLocaleString()):'Unknown'}</p><p><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps?q=${encodeURIComponent(g.latitude+','+g.longitude)}">Open Google Maps ↗</a></p><iframe title="Location map" width="100%" height="270" loading="lazy" src="https://maps.google.com/maps?q=${encodeURIComponent(g.latitude+','+g.longitude)}&z=15&output=embed"></iframe>`:'<div class="status warn">GPS not received yet. Monitor needs location permission and must be online.</div>';$('details').innerHTML=`<h2>${d.emergency?'🚨 SOS ALERT ACTIVE':'Room details'}</h2><div class="stats"><div class="stat"><strong>${d.emergency?'SOS':'OK'}</strong><span>Alert status</span></div><div class="stat"><strong>${d.active?'Active':'Stopped'}</strong><span>Monitor status</span></div></div><p><b>Name:</b> ${safe(d.name)}</p><p><b>Room ID:</b> ${safe(d.roomId||raw)}</p><p><b>Phone:</b> ${safe(d.phone)}</p><p><b>Emergency contact:</b> ${safe(d.emergencyContact)}</p><p><b>Notes:</b> ${safe(d.message)}</p><p><b>Started:</b> ${d.startedAt?safe(new Date(d.startedAt).toLocaleString()):'Unknown'}</p><p><b>SOS time:</b> ${d.sosAt?safe(new Date(d.sosAt).toLocaleString()):'No SOS recorded'}</p><p><b>Resolved:</b> ${d.resolvedAt?safe(new Date(d.resolvedAt).toLocaleString()):'Not recorded'}</p><p><b>Last update:</b> ${d.updatedAt?safe(new Date(d.updatedAt).toLocaleString()):'Unknown'}</p>${map}`;status('Connected ✓ Live updates active.','ok')},e=>status('Firebase read error: '+e.message+'. Check database URL and Rules.','err'));current={path,fn}};
$('disconnect').onclick=()=>{if(current){db.ref(current.path).off('value',current.fn);current=null}$('details').innerHTML='<h2>Disconnected</h2>';status('Disconnected.')};
</script></body></html>
