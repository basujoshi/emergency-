<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BD Danger Alert Admin</title><style>*{box-sizing:border-box}body{margin:0;padding:14px;background:#f2f5fa;color:#172033;font:16px Arial}.wrap{max-width:950px;margin:auto}.hero{background:linear-gradient(135deg,#10284b,#155eef);color:white;padding:22px;border-radius:18px}.hero p{color:#dbeafe;line-height:1.5}.card,.room{background:white;border:1px solid #dce3ed;border-radius:15px;padding:17px;margin:13px 0;overflow-wrap:anywhere}label{display:block;font-weight:bold;margin:12px 0 6px}input,textarea,select,button{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}textarea{min-height:80px}button{background:#155eef;color:white;border:0;font-weight:bold;margin-top:9px;cursor:pointer}.secondary{background:#e8eef8;color:#183153}.danger{background:#c62828}.status{padding:12px;background:#eef4ff;border-radius:10px;margin:12px 0;line-height:1.45}.ok{background:#dcfae6;color:#05603a}.err{background:#fee4e2;color:#912018}.warn{background:#fff4d6;color:#854d0e}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.pill{display:inline-block;background:#e8eef8;border-radius:20px;padding:5px 9px;font-size:12px;font-weight:bold}.sos{border:2px solid #d92d20}.map{color:#155eef;font-weight:bold}.muted{font-size:13px;color:#667085;line-height:1.5}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:9px}.stat{background:#f6f8fc;border-radius:10px;padding:12px}.stat strong{display:block;font-size:22px}.stat span{font-size:12px;color:#667085}iframe{max-width:100%;border:0;border-radius:12px}@media(max-width:500px){body{padding:8px}.card,.room{padding:13px}}</style><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script></head><body><main class="wrap"><header class="hero"><span class="pill">BD DANGER ALERT</span><h1>Admin Live Dashboard</h1><p>Automatically lists every room under /bdDangerRooms. No Room ID required.</p></header><section class="card"><div id="status" class="status">Connecting…</div><div class="stats"><div class="stat"><strong id="total">0</strong><span>Total rooms</span></div><div class="stat"><strong id="active">0</strong><span>Active monitors</span></div><div class="stat"><strong id="sosCount">0</strong><span>Active SOS</span></div></div><div class="grid"><div><label>Search</label><input id="search" placeholder="Name, room, phone"></div><div><label>Filter</label><select id="filter"><option value="all">All rooms</option><option value="sos">SOS only</option><option value="active">Active monitors</option><option value="inactive">Inactive monitors</option></select></div></div><button id="notify" class="secondary">Enable sound + browser notifications</button><p class="muted">Keep this dashboard open for live updates. Notifications require permission and may not work when the page is closed.</p></section><div id="rooms"></div></main><script>const firebaseConfig = {
 apiKey:"AIzaSyBrVJ_vcLjxZMSZOjqUQocWjVf36GQ1bEw",
 authDomain:"king-59c08.firebaseapp.com",
 databaseURL:"https://king-59c08-default-rtdb.firebaseio.com",
 projectId:"king-59c08",
 storageBucket:"king-59c08.firebasestorage.app",
 messagingSenderId:"982382372976",
 appId:"1:982382372976:web:07758531a29fdd966e6cb5"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

const $=x=>document.getElementById(x);let rooms={},seen=new Set(),enabled=false,audio=null;
function status(t,c=''){$('status').className='status '+c;$('status').textContent=t}
function safe(v){return String(v==null||v===''?'Not provided':v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
$('search').oninput=render;$('filter').onchange=render;
$('notify').onclick=async()=>{enabled=true;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();await audio.resume()}catch(e){}if('Notification'in window){try{status('Sound enabled; notification permission: '+await Notification.requestPermission(),'ok')}catch(e){status('Sound enabled')}}else status('Sound enabled; browser notifications unsupported')};
function render(){let q=$('search').value.trim().toLowerCase(),f=$('filter').value;let a=Object.entries(rooms).map(([id,d])=>({id,d:d||{}})).sort((x,y)=>Number(!!y.d.emergency)-Number(!!x.d.emergency)).filter(({id,d})=>(!q||[id,d.roomId,d.name,d.phone,d.emergencyContact].join(' ').toLowerCase().includes(q))&&(f==='all'||f==='sos'&&d.emergency===true||f==='active'&&d.active===true||f==='inactive'&&d.active!==true));let vals=Object.values(rooms).filter(Boolean);$('total').textContent=vals.length;$('active').textContent=vals.filter(d=>d.active===true).length;$('sosCount').textContent=vals.filter(d=>d.emergency===true).length;$('rooms').innerHTML=a.length?a.map(({id,d})=>{let g=d.location||{},has=typeof g.latitude==='number'&&typeof g.longitude==='number'&&Number.isFinite(g.latitude)&&Number.isFinite(g.longitude);let map=has?`<p><b>GPS:</b> ${safe(g.latitude)}, ${safe(g.longitude)} ±${safe(g.accuracy)}m</p><p><a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps?q=${encodeURIComponent(g.latitude+','+g.longitude)}">Open Google Maps ↗</a></p>`:'<p>GPS not received</p>';return `<section class="room ${d.emergency?'sos':''}"><h3>${d.emergency?'🚨 SOS — ':''}${safe(d.name||'Unnamed')} <span class="pill">${safe(d.roomId||id)}</span></h3><p><b>Phone:</b> ${safe(d.phone)}</p><p><b>Emergency contact:</b> ${safe(d.emergencyContact)}</p><p><b>Notes:</b> ${safe(d.message)}</p><p><b>Monitor:</b> ${d.active?'Active':'Inactive/stopped'}</p><p><b>SOS time:</b> ${d.sosAt?safe(new Date(d.sosAt).toLocaleString()):'None'}</p><p><b>Last update:</b> ${d.updatedAt?safe(new Date(d.updatedAt).toLocaleString()):'Unknown'}</p>${map}<p><a class="map" href="alert.html?room=${encodeURIComponent(d.roomId||id)}">Open in Alert Viewer ↗</a></p></section>`}).join(''):'<section class="card">No rooms match. Start monitoring first or check database Rules.</section>'}
db.ref('bdDangerRooms').on('value',s=>{rooms=s.val()||{};for(const [id,d] of Object.entries(rooms)){if(d&&d.emergency===true&&!seen.has(id)){if(enabled&&audio){try{let o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=880;g.gain.value=.12;o.start();o.stop(audio.currentTime+.6)}catch(e){}}if(enabled&&'Notification'in window&&Notification.permission==='granted'){try{new Notification('BD DANGER ALERT — SOS',{body:(d.name||'Unknown')+' | Room '+(d.roomId||id)})}catch(e){}}}}seen=new Set(Object.entries(rooms).filter(([id,d])=>d&&d.emergency===true).map(([id])=>id));status('Firebase connected ✓ Live data received.','ok');render()},e=>status('Firebase read failed: '+e.message+'. Check Rules and database URL.','err'));
</script></body></html>
