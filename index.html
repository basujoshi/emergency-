
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BD Alert Viewer</title>
<style>
body{background:#080e19;color:white;font-family:Arial;padding:16px}
main{max-width:850px;margin:auto}
section{background:#121d30;padding:18px;border-radius:14px;margin:12px 0}
input,button{width:100%;box-sizing:border-box;padding:13px;margin:6px 0;border-radius:9px;font-size:16px}
input{background:#080e19;color:white;border:1px solid #344760}
button{background:#2563eb;color:white;border:0;font-weight:bold}
#details{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.item{background:#080e19;padding:13px;border-radius:10px;overflow-wrap:anywhere}
.label{color:#94a3b8;font-size:12px}.value{margin-top:6px;white-space:pre-wrap}
a{color:#93c5fd}
iframe{width:100%;height:300px;border:0;border-radius:10px}
</style>
</head>
<body>
<main>
<section>
<h1>🚨 BD ALERT VIEWER</h1>
<input id="room" placeholder="Room ID e.g. BD1001">
<button id="connect">VIEW LIVE DETAILS</button>
<p id="status">Not connected</p>
</section>
<section>
<h2 id="headline">Waiting for room</h2>
<div id="details"></div>
<h2>📍 GPS Location</h2>
<p id="coords">Location unavailable</p>
<a id="map" target="_blank" hidden>Open Google Maps</a>
<iframe id="frame" title="GPS map" hidden></iframe>
</section>
</main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getDatabase,ref,onValue}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
''' + firebaseConfig.replace('const firebaseConfig = ', 'const firebaseConfig=') + '''
const db=getDatabase(initializeApp(firebaseConfig));
const $=id=>document.getElementById(id);let off=null;
function add(k,v){
 const d=document.createElement("div");d.className="item";
 const l=document.createElement("div");l.className="label";l.textContent=k;
 const val=document.createElement("div");val.className="value";val.textContent=v??"Not provided";
 d.append(l,val);$("details").append(d);
}
$("connect").onclick=()=>{
 const room=$("room").value.trim().replace(/[.#$[\\\\]\\/]/g,"_");
 if(!room){$("status").textContent="Enter Room ID";return}
 if(off)off();
 off=onValue(ref(db,"bdDangerRooms/"+room),snap=>{
  if(!snap.exists()){$("headline").textContent="Room not found";$("details").replaceChildren();$("status").textContent="No data found";return}
  const d=snap.val(),loc=d.location;
  $("headline").textContent=d.emergency?"🆘 SOS EMERGENCY":d.active?"🟢 MONITOR ACTIVE":"⚠️ INACTIVE";
  $("details").replaceChildren();
  add("Name",d.name);add("Room ID",d.room||room);add("Phone",d.phone);add("Emergency contact",d.emergencyContact);
  add("Message",d.message);add("SOS time",d.sosAt?new Date(d.sosAt).toLocaleString():"No SOS recorded");
  add("Last heartbeat",d.heartbeat?new Date(d.heartbeat).toLocaleString():"Unknown");
  add("Last update",d.updatedAt?new Date(d.updatedAt).toLocaleString():"Unknown");
  if(loc&&Number.isFinite(Number(loc.lat))&&Number.isFinite(Number(loc.lng))){
   $("coords").textContent=`${loc.lat}, ${loc.lng} • accuracy ±${loc.accuracy??"?"} m`;
   $("map").href=`https://www.google.com/maps?q=${loc.lat},${loc.lng}`;$("map").hidden=false;
   $("frame").src=`https://maps.google.com/maps?q=${loc.lat},${loc.lng}&z=15&output=embed`;$("frame").hidden=false;
  }else{$("coords").textContent="No GPS location received";$("map").hidden=true;$("frame").hidden=true}
  $("status").textContent="Live update: "+new Date().toLocaleTimeString();
 },e=>$("status").textContent="Firebase error: "+e.message);
};
</script>
</body>
</html>
