<html lang="en">

<body>
<div class="card">
<h2>BD DANGER ALERT</h2>
<input id="room" placeholder="Enter the same Room ID">
<button id="connect">CONNECT ALERT</button>
<button id="enable">ENABLE SOUND</button>
<div id="screen">
<h1 id="heading">STANDBY</h1>
<p id="status">Enter Room ID and connect.</p>
</div>
</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBrVJ_vcLjxZMSZOjqUQocWjVf36GQ1bEw",
  authDomain: "king-59c08.firebaseapp.com",
  databaseURL: "https://king-59c08-default-rtdb.firebaseio.com",
  projectId: "king-59c08",
  storageBucket: "king-59c08.firebasestorage.app",
  messagingSenderId: "982382372976",
  appId: "1:982382372976:web:07758531a29fdd966e6cb5",
  measurementId: "G-RQ00W2EW9Q"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const $ = id => document.getElementById(id);

let room = null;
let unsubscribe = [];
let audioContext = null;
let alarmTimer = null;
let alarmEnabled = false;
let wasDanger = false;

function showDanger(danger, message) {
  $("screen").classList.toggle("danger", danger);
  $("heading").textContent = danger ? "⚠ DANGER ⚠" : "MONITOR ONLINE";
  $("status").textContent = message;

  if (danger && !wasDanger && alarmEnabled) startAlarm();
  if (!danger) stopAlarm();

  if (danger && !wasDanger && "Notification" in window &&
      Notification.permission === "granted") {
    try {
      new Notification("BD DANGER ALERT", {
        body: "The monitor heartbeat has stopped."
      });
    } catch {}
  }

  wasDanger = danger;
}

function startAlarm() {
  stopAlarm();

  try {
    audioContext = audioContext || new AudioContext();

    const beep = () => {
      if (!audioContext || audioContext.state === "closed") return;

      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      oscillator.type = "square";
      oscillator.frequency.value = 880;
      gain.gain.value = 0.15;
      oscillator.connect(gain);
      gain.connect(audioContext.destination);
      oscillator.start();
      oscillator.stop(audioContext.currentTime + 0.25);
    };

    beep();
    alarmTimer = setInterval(beep, 700);
  } catch (error) {
    $("status").textContent += " (Sound blocked by browser)";
  }
}

function stopAlarm() {
  if (alarmTimer) clearInterval(alarmTimer);
  alarmTimer = null;
}

$("enable").onclick = async () => {
  try {
    audioContext = audioContext || new AudioContext();
    await audioContext.resume();
    alarmEnabled = true;

    if ("Notification" in window &&
        Notification.permission === "default") {
      await Notification.requestPermission();
    }

    $("enable").textContent = "SOUND ENABLED";
  } catch {
    $("status").textContent =
      "Sound unavailable. Check browser permissions.";
  }
};

$("connect").onclick = () => {
  const value = $("room").value.trim();

  if (!/^[A-Za-z0-9_-]{3,60}$/.test(value)) {
    $("status").textContent = "Enter a valid Room ID.";
    return;
  }

  unsubscribe.forEach(fn => fn());
  unsubscribe = [];
  room = value;
  wasDanger = false;
  showDanger(true, "Waiting for monitor heartbeat...");

  const heartbeatRef = ref(db, `bdDangerRooms/${room}/heartbeat`);
  const activeRef = ref(db, `bdDangerRooms/${room}/active`);

  let heartbeat = 0;
  let active = false;
  let received = false;

  function evaluate() {
    const online = active && heartbeat > 0 &&
      Date.now() - heartbeat < 10000;

    if (online) {
      showDanger(false, "Heartbeat received • " +
        new Date(heartbeat).toLocaleTimeString());
    } else {
      showDanger(true, received
        ? "Monitor is offline or heartbeat timed out."
        : "Waiting for first heartbeat...");
    }
  }

  unsubscribe.push(onValue(heartbeatRef, snapshot => {
    heartbeat = snapshot.val() || 0;
    received = received || heartbeat > 0;
    evaluate();
  }, error => {
    showDanger(true, "Database error: " + error.message);
  }));

  unsubscribe.push(onValue(activeRef, snapshot => {
    active = snapshot.val() === true;
    evaluate();
  }, error => {
    showDanger(true, "Database error: " + error.message);
  }));

  const watchdog = setInterval(evaluate, 2000);
  unsubscribe.push(() => clearInterval(watchdog));
};
</script>
</body>
