<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BD Emergency Alert</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:18px;background:#08111f;color:white;
font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh}
.card{width:100%;max-width:480px;background:#142238;padding:22px;border-radius:18px;text-align:center}
input,button,a{display:block;width:100%;padding:14px;margin:9px 0;border-radius:10px;
font:inherit;text-decoration:none}
input{background:#08111f;color:white;border:1px solid #52627b}
button{background:#16c784;color:#062416;border:0;font-weight:bold}
#sound{background:#367dff;color:white}#map{background:#e6f3ff;color:#0a3a72}
#screen{padding:20px 12px;border-radius:14px;background:#075b3b;margin-top:15px}
#screen.danger{background:#b00016;animation:blink .65s infinite}
#heading{font-size:clamp(28px,8vw,42px)}#message{line-height:1.6;overflow-wrap:anywhere}
#status,#location{overflow-wrap:anywhere;line-height:1.5}
@keyframes blink{50%{background:#ff1028}}
</style>
</head>
<body>
<div class="card">
<h2>BD EMERGENCY ALERT SYSTEM</h2>
<input id="room" placeholder="Enter the same Room ID">
<button id="connect">CONNECT TO MONITOR</button>
<button id="sound">ENABLE ALARM & NOTIFICATIONS</button>

<div id="screen">
<h1 id="heading">STANDBY</h1>
<p id="message">Waiting for monitor status...</p>
<p id="status">Enter Room ID and connect.</p>
<p id="location">GPS location: Not received</p>
<a id="map" href="#" target="_blank" rel="noopener" hidden>OPEN LOCATION IN GOOGLE MAPS</a>
</div>
</div>

<script type="module">
import {initializeApp} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase,ref,onValue} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig={
 apiKey:"AIzaSyBrVJ_vcLjxZMSZOjqUQocWjVf36GQ1bEw",
 authDomain:"king-59c08.firebaseapp.com",
 databaseURL:"https://king-59c08-default-rtdb.firebaseio.com",
 projectId:"king-59c08",
 storageBucket:"king-59c08.firebasestorage.app",
 messagingSenderId:"982382372976",
 appId:"1:982382372976:web:07758531a29fdd966e6cb5",
 measurementId:"G-RQ00W2EW9Q"
};
const db=getDatabase(initializeApp(firebaseConfig));
const $=id=>document.getElementById(id);
let heartbeat=0,active=false,emergency=false,message="",locationData=null;
let soundEnabled=false,audioCtx=null,alarmTimer=null,wasDanger=false;
let lastSosAt=0,unsubs=[],watchdog=null,connected=false;

function startAlarm(){
 if(!soundEnabled||alarmTimer)return;
 try{
  audioCtx=audioCtx||new AudioContext();
  const beep=()=>{
   if(!audioCtx||audioCtx.state==="closed")return;
   const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
   osc.type="square";osc.frequency.value=950;gain.gain.value=.18;
   osc.connect(gain);gain.connect(audioCtx.destination);
   osc.start();osc.stop(audioCtx.currentTime+.35);
  };
  beep();alarmTimer=setInterval(beep,750);
 }catch(e){}
}
function stopAlarm(){
 if(alarmTimer)clearInterval(alarmTimer);
 alarmTimer=null;
}
function render(){
 if(!connected)return;
 const stale=!heartbeat||Date.now()-heartbeat>10000;
 const danger=emergency||!active||stale;

 $("screen").classList.toggle("danger",danger);
 $("heading").textContent=emergency?"🚨 SOS EMERGENCY 🚨":
  danger?"⚠ MONITOR OFFLINE ⚠":"MONITOR ONLINE";

 $("message").textContent=emergency?
  (message||"SOS! I AM IN TROUBLE AND NEED IMMEDIATE HELP. PLEASE CONTACT ME NOW."):
  danger?
  "The monitor has stopped sending heartbeat. Please check on this person immediately.":
  "Monitor is active. No SOS has been reported.";

 $("status").textContent=emergency?
  "EMERGENCY SOS RECEIVED • "+(lastSosAt?new Date(lastSosAt).toLocaleString():""):
  stale?"Heartbeat missing or outdated. Monitor may be offline.":
  "Last heartbeat: "+new Date(heartbeat).toLocaleTimeString();

 if(locationData&&Number.isFinite(Number(locationData.latitude))&&
    Number.isFinite(Number(locationData.longitude))){
  const lat=Number(locationData.latitude),lon=Number(locationData.longitude);
  $("location").textContent="Coordinates: "+lat.toFixed(6)+", "+lon.toFixed(6)+
   (locationData.accuracy?" • Reported accuracy ±"+Math.round(locationData.accuracy)+" m":"");
  $("map").href="https://maps.google.com/?q="+lat+","+lon;
  $("map").hidden=false;
 }else{
  $("location").textContent="GPS location not received yet.";
  $("map").hidden=true;
 }

 if(danger&&!wasDanger){
  if(soundEnabled)startAlarm();
  if(soundEnabled&&"Notification" in window&&Notification.permission==="granted"){
   try{new Notification(emergency?"SOS EMERGENCY":"MONITOR OFFLINE",{
    body:message||"Please check the alert page immediately."
   })}catch(e){}
  }
 }
 if(!danger)stopAlarm();
 wasDanger=danger;
}

$("sound").onclick=async()=>{
 try{
  audioCtx=audioCtx||new AudioContext();
  await audioCtx.resume();
  soundEnabled=true;
  if("Notification" in window&&Notification.permission==="default"){
   await Notification.requestPermission();
  }
  $("sound").textContent="ALARM ENABLED";
  if(emergency||!active||!heartbeat||Date.now()-heartbeat>10000)startAlarm();
 }catch(e){
  $("status").textContent="Sound blocked. Check browser permissions.";
 }
};

$("connect").onclick=()=>{
 const room=$("room").value.trim();
 if(!/^[A-Za-z0-9_-]{5,80}$/.test(room)){
  $("status").textContent="Enter a valid Room ID.";
  return;
 }
 unsubs.forEach(fn=>fn());
 unsubs=[];if(watchdog)clearInterval(watchdog);
 heartbeat=0;active=false;emergency=false;message="";
 locationData=null;lastSosAt=0;wasDanger=false;connected=true;

 const base="bdDangerRooms/"+room;
 const listen=(path,callback)=>{
  unsubs.push(onValue(ref(db,base+"/"+path),s=>{
   callback(s.val());render();
  },e=>{$("status").textContent="Firebase error: "+e.message}));
 };
 listen("heartbeat",v=>heartbeat=Number(v)||0);
 listen("active",v=>active=v===true);
 listen("emergency",v=>emergency=v===true);
 listen("message",v=>message=typeof v==="string"?v:"");
 listen("location",v=>locationData=v&&typeof v==="object"?v:null);
 listen("sosAt",v=>lastSosAt=Number(v)||0);

 watchdog=setInterval(render,2000);
 $("status").textContent="Connected. Waiting for monitor data...";
};
</script>
</body>
</html>
