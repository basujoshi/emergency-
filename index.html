
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BD Danger — Alert Viewer</title>
<style>
*{box-sizing:border-box}body{background:#0b1020;color:white;font-family:Arial;padding:20px}
main{max-width:520px;margin:20px auto;background:#151d32;padding:24px;border-radius:18px}
h1{color:#ff5555}input,button{width:100%;padding:14px;margin:7px 0;border-radius:9px;font-size:16px}
input{background:#0b1020;color:white;border:1px solid #475569}button{border:0;background:#2563eb;color:white;font-weight:bold}
.card{background:#0b1020;border-radius:10px;padding:14px;margin-top:12px;overflow-wrap:anywhere}
a{color:#93c5fd}.danger{color:#ff5353;font-size:23px;font-weight:bold}
</style>
</head>
<body>
<main>
<h1>🚨 BD ALERT VIEWER</h1>
<input id="room" placeholder="Enter the person's Room ID">
<button id="connect">CONNECT TO ROOM</button>
<button id="alarm">ENABLE SOUND & NOTIFICATIONS</button>
<div class="card" id="status">Status: Not connected</div>
<div class="card" id="details">Waiting for room data.</div>
<a id="map" target="_blank" rel="noopener" hidden>Open location in Google Maps</a>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
 apiKey: "AIzaSyBrVJ_vcLjxZMSZOjqUQocWjVf36GQ1bEw",
 authDomain: "king-59c08.firebaseapp.com",
 databaseURL: "https://king-59c08-default-rtdb.firebaseio.com",
 projectId: "king-59c08",
 storageBucket: "king-59c08.firebasestorage.app",
 messagingSenderId: "982382372976",
 appId: "1:982382372976:web:07758531a29fdd966e6cb5",
 measurementId: "G-RQ00W2EW9Q"
};
const db = getDatabase(initializeApp(firebaseConfig));
const $ = id => document.getElementById(id);
let unsubscribe = null, audioCtx = null, lastSos = 0, notificationsEnabled = false;

$("alarm").onclick = async () => {
 try {
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  await audioCtx.resume();
  if ("Notification" in window) {
   const permission = await Notification.requestPermission();
   notificationsEnabled = permission === "granted";
  }
  $("status").textContent = "Sound enabled. Keep this page open.";
 } catch(e) {
  $("status").textContent = "Sound setup failed: " + e.message;
 }
};

function beep() {
 if (!audioCtx) return;
 try {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.frequency.value = 880;
  gain.gain.value = 0.15;
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.6);
 } catch {}
}

$("connect").onclick = () => {
 const room = $("room").value.trim().replace(/[.#$/\[\]]/g, "_");
 if (!room) { $("status").textContent = "Enter a Room ID first."; return; }
 if (unsubscribe) unsubscribe();

 $("status").textContent = "Connecting…";
 unsubscribe = onValue(ref(db, "bdDangerRooms/" + room), snap => {
  if (!snap.exists()) {
   $("details").textContent = "No data found for this Room ID yet.";
   $("status").textContent = "Waiting for the monitor to start.";
   $("map").hidden = true;
   return;
  }
  const d = snap.val();
  const loc = d.location;
  const isDanger = d.emergency === true;
  $("status").innerHTML = isDanger
   ? '<div class="danger">🆘 SOS EMERGENCY</div>'
   : (d.active ? "🟢 Monitor active" : "⚪ Monitor inactive");
  $("details").innerHTML = "";
  const rows = [
   ["Name", d.name || "Not provided"],
   ["Room ID", room],
   ["Message", d.message || "No message"],
   ["Last heartbeat", d.heartbeat ? new Date(d.heartbeat).toLocaleString() : "Unknown"],
   ["Last update", d.updatedAt ? new Date(d.updatedAt).toLocaleString() : "Unknown"],
   ["GPS", loc ? `${loc.lat}, ${loc.lng} (accuracy ±${loc.accuracy ?? "?"} m)` : "Not available"]
  ];
  rows.forEach(([k,v]) => {
   const p = document.createElement("p");
   p.textContent = k + ": " + v;
   $("details").appendChild(p);
  });
  if (loc && Number.isFinite(loc.lat) && Number.isFinite(loc.lng)) {
   $("map").href = `https://www.google.com/maps?q=${loc.lat},${loc.lng}`;
   $("map").hidden = false;
  } else $("map").hidden = true;

  if (isDanger && d.sosAt && d.sosAt !== lastSos) {
   lastSos = d.sosAt;
   beep();
   if (notificationsEnabled && "Notification" in window) {
    new Notification("BD DANGER ALERT", {
     body: (d.name || "Someone") + " has sent an SOS alert."
    });
   }
  }
 }, error => {
  $("status").textContent = "Firebase error: " + error.message;
 });
};
</script>
</body>
</html>
