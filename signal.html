<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BD Danger Monitor</title>
<style>
body{margin:0;background:#07111f;color:#fff;font-family:Arial,sans-serif;
display:grid;place-items:center;min-height:100vh;padding:18px;box-sizing:border-box}
.card{width:100%;max-width:460px;background:#142238;padding:24px;
border-radius:20px;box-sizing:border-box}
h1{color:#4db8ff}input,button{width:100%;padding:14px;margin:8px 0;
border-radius:10px;box-sizing:border-box;font-size:16px}
input{background:#07111f;color:white;border:1px solid #47617e}
button{border:0;background:#00c781;color:#062316;font-weight:bold}
#stop{background:#ff4255;color:white}
#status{padding:14px;background:#07111f;border-radius:10px;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="card">
<h1>BD DANGER MONITOR</h1>
<p>Keep this page open while monitoring.</p>
<input id="room" placeholder="Room ID (same on both pages)">
<button id="start">START MONITOR</button>
<button id="stop" disabled>STOP MONITOR</button>
<div id="status">Status: Stopped</div>
</div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, onDisconnect }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBrVJ_vcLjxZMSZOjqUQocWjVf36GQ1bEw",
  authDomain: "king-59c08.firebaseapp.com",
  databaseURL: "https://king-59c08-default-rtdb.firebaseio.com",
  projectId: "king-59c08",
  storageBucket: "king-59c08.firebasestorage.app",
  messagingSenderId: "982382372976",
  appId: "1:982382372976:web:07758531a29fdd966e6cb5",
  measurementId: "G-RQ00W2EW9Q"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const $ = id => document.getElementById(id);

let timer = null;
let activeRoom = null;

function validRoom(value) {
  return /^[A-Za-z0-9_-]{3,60}$/.test(value);
}

$("start").onclick = async () => {
  const room = $("room").value.trim();

  if (!validRoom(room)) {
    $("status").textContent =
      "Enter a Room ID using 3–60 letters, numbers, _ or -.";
    return;
  }

  if (timer) clearInterval(timer);
  activeRoom = room;
  const heartbeatRef = ref(db, `bdDangerRooms/${room}/heartbeat`);

  try {
    await set(ref(db, `bdDangerRooms/${room}/active`), true);
    await set(heartbeatRef, Date.now());

    timer = setInterval(async () => {
      try {
        await set(heartbeatRef, Date.now());
        $("status").textContent =
          "MONITOR ONLINE • Last heartbeat: " +
          new Date().toLocaleTimeString();
      } catch (error) {
        $("status").textContent = "Database error: " + error.message;
      }
    }, 2000);

    $("status").textContent = "MONITOR ONLINE";
    $("start").disabled = true;
    $("stop").disabled = false;
    $("room").disabled = true;
  } catch (error) {
    $("status").textContent =
      "Cannot connect: " + error.message +
      ". Check Firebase Database Rules.";
  }
};

$("stop").onclick = async () => {
  if (timer) clearInterval(timer);
  timer = null;

  try {
    if (activeRoom) {
      await set(ref(db, `bdDangerRooms/${activeRoom}/active`), false);
    }
  } catch (error) {
    console.error(error);
  }

  activeRoom = null;
  $("status").textContent = "MONITOR STOPPED";
  $("start").disabled = false;
  $("stop").disabled = true;
  $("room").disabled = false;
};

window.addEventListener("pagehide", () => {
  if (timer) clearInterval(timer);
});
</script>
</body>
</html>
