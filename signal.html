
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BD Danger Alert</title>
<style>
body{margin:0;background:#0b1220;color:white;font-family:Arial;padding:18px}
main{max-width:550px;margin:auto;background:#172338;padding:22px;border-radius:18px}
h1{color:#fb7185}input,textarea,button{width:100%;padding:13px;margin:7px 0;box-sizing:border-box;border-radius:9px;font-size:16px}
input,textarea{background:#0b1220;color:white;border:1px solid #344760}
button{border:0;font-weight:bold;background:#2563eb;color:white}
#sos{background:#e11d48;font-size:22px;padding:20px}
#stop{background:#475569}
</style>
</head>
<body>
<main>
<h1>🆘 BD DANGER ALERT</h1>
<input id="name" placeholder="Your full name">
<input id="room" placeholder="Room ID e.g. BD1001">
<input id="phone" placeholder="Phone number (optional)">
<input id="contact" placeholder="Emergency contact (optional)">
<textarea id="message">SOS! I NEED HELP. PLEASE CHECK MY LOCATION.</textarea>
<button id="start">START MONITORING + GPS</button>
<button id="sos">🆘 SEND SOS ALERT</button>
<button id="stop">STOP MONITORING</button>
<p id="status">Not started</p>
<p id="location">GPS not available</p>
<a id="map" target="_blank" hidden>Open GPS location</a>
</main>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getDatabase,ref,update,onDisconnect}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig={
apiKey:"AIzaSyBrVJ_vcLjxZMSZOjqUQocWjVf36GQ1bEw",
authDomain:"king-59c08.firebaseapp.com",
databaseURL:"https://king-59c08-default-rtdb.firebaseio.com",
projectId:"king-59c08",
storageBucket:"king-59c08.firebasestorage.app",
messagingSenderId:"982382372976",
appId:"1:982382372976:web:07758531a29fdd966e6cb5",
measurementId:"G-RQ00W2EW9Q"
};

const db=getDatabase(initializeApp(firebaseConfig));
const $=id=>document.getElementById(id);
let room="",watch=null,timer=null,running=false,lastGPS=null;

function path(){
 const value=$("room").value.trim().replace(/[.#$[\]\/]/g,"_");
 if(!value)throw Error("Enter Room ID");
 return value;
}
function profile(){
 return{
 name:$("name").value.trim()||"Not provided",
 phone:$("phone").value.trim()||"Not provided",
 emergencyContact:$("contact").value.trim()||"Not provided",
 message:$("message").value.trim()||"SOS — I NEED HELP"
 };
}
function roomRef(){return ref(db,"bdDangerRooms/"+room)}
function status(t){$("status").textContent=t}

async function start(){
 try{
  if(running)return;
  room=path();
  running=true;
  await update(roomRef(),{
   ...profile(),room,active:true,emergency:false,
   startedAt:Date.now(),heartbeat:Date.now(),updatedAt:Date.now()
  });
  await onDisconnect(ref(db,"bdDangerRooms/"+room+"/active")).set(false);

  timer=setInterval(()=>{
   if(running)update(roomRef(),{
    heartbeat:Date.now(),updatedAt:Date.now()
   }).catch(e=>status(e.message));
  },4000);

  if(!navigator.geolocation){
   status("Monitoring active; GPS unsupported");return;
  }

  watch=navigator.geolocation.watchPosition(async pos=>{
   lastGPS={
    lat:pos.coords.latitude,
    lng:pos.coords.longitude,
    accuracy:Math.round(pos.coords.accuracy),
    time:Date.now()
   };
   $("location").textContent=
    `GPS: ${lastGPS.lat}, ${lastGPS.lng} ±${lastGPS.accuracy}m`;
   $("map").href=`https://www.google.com/maps?q=${lastGPS.lat},${lastGPS.lng}`;
   $("map").hidden=false;
   try{
    await update(roomRef(),{
     location:lastGPS,heartbeat:Date.now(),updatedAt:Date.now()
    });
   }catch(e){status("GPS save error: "+e.message)}
  },e=>{
   $("location").textContent="GPS unavailable: "+e.message;
  },{enableHighAccuracy:true,maximumAge:3000,timeout:20000});

  status("Monitoring active. Keep this page open.");
 }catch(e){running=false;status("Error: "+e.message)}
}

async function sendSOS(){
 try{
  if(!running){await start();if(!running)return}
  await update(roomRef(),{
   ...profile(),room,active:true,emergency:true,
   sosAt:Date.now(),heartbeat:Date.now(),updatedAt:Date.now(),
   ...(lastGPS?{location:lastGPS}:{})
  });
  status("SOS sent. Admin dashboard will receive it.");
 }catch(e){status("SOS error: "+e.message)}
}

async function stop(){
 running=false;
 if(timer)clearInterval(timer);
 timer=null;
 if(watch!==null)navigator.geolocation.clearWatch(watch);
 watch=null;
 if(room){
  try{
   await update(roomRef(),{active:false,updatedAt:Date.now()});
   status("Monitoring stopped");
  }catch(e){status("Firebase error: "+e.message)}
 }else status("Not started");
}

$("start").onclick=start;
$("sos").onclick=sendSOS;
$("stop").onclick=stop;
</script>
</body>
</html>
