<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BD Danger Monitor</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:18px;background:#08111f;color:#fff;
font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh}
.card{width:100%;max-width:480px;background:#142238;padding:22px;border-radius:18px}
h1{color:#ff5364}p{line-height:1.5;color:#d6dfed}
input,textarea,button{width:100%;padding:14px;margin:7px 0;border-radius:10px;font:inherit}
input,textarea{background:#08111f;color:white;border:1px solid #52627b}
textarea{min-height:95px}button{border:0;font-weight:bold;cursor:pointer}
#start{background:#16c784;color:#062416}#sos{background:#ff1838;color:white}
#stop{background:#46556b;color:white}#status{padding:13px;background:#08111f;border-radius:10px;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="card">
<h1>BD DANGER MONITOR</h1>
<p>Keep this page open. Allow location access for GPS updates.</p>
<label>Room ID (use the same ID on Alert page)</label>
<input id="room" placeholder="Example: BD-HELP-8X29K7">
<label>Emergency message</label>
<textarea id="message">SOS! I AM IN TROUBLE AND NEED IMMEDIATE HELP. PLEASE CHECK MY LOCATION AND CONTACT ME NOW.</textarea>
<button id="start">START MONITOR + GPS</button>
<button id="sos">SEND SOS NOW</button>
<button id="stop">STOP MONITOR</button>
<div id="status">Status: Not started</div>
<p id="coords">Location: Not available</p>
</div>

<script type="module">
import {initializeApp} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase,ref,set,update} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig={
 apiKey:"AIzaSyBrVJ_vcLjxZMSZOjqUQocWjVf36GQ1bEw",
 authDomain:"king-59c08.firebaseapp.com",
 databaseURL:"https://king-59c08-default-rtdb.firebaseio.com",
 projectId:"king-59c08",
 storageBucket:"king-59c08.firebasestorage.app",
 messagingSenderId:"982382372976",
 appId:"1:982382372976:web:07758531a29fdd966e6cb5",
 measurementId:"G-RQ00W2EW9Q"
};
const db=getDatabase(initializeApp(firebaseConfig));
const $=id=>document.getElementById(id);
let room="",watchId=null,beatTimer=null,locationTimer=null,started=false;
let latestLocation=null;

function roomValid(s){return /^[A-Za-z0-9_-]{5,80}$/.test(s)}
function base(){return "bdDangerRooms/"+room}
function showError(e){$("status").textContent="Error: "+(e.message||e)}

async function publishLocation(position){
 latestLocation={
  latitude:position.coords.latitude,
  longitude:position.coords.longitude,
  accuracy:position.coords.accuracy,
  timestamp:Date.now(),
  mapsUrl:"https://maps.google.com/?q="+position.coords.latitude+","+position.coords.longitude
 };
 $("coords").textContent=
  "GPS: "+latestLocation.latitude.toFixed(6)+", "+
  latestLocation.longitude.toFixed(6)+
  " • Accuracy ±"+Math.round(latestLocation.accuracy)+" m";

 if(room){
  try{await set(ref(db,base()+"/location"),latestLocation)}
  catch(e){showError(e)}
 }
}

async function sendHeartbeat(){
 if(!started||!room)return;
 try{
  await update(ref(db,base()),{
   heartbeat:Date.now(),
   active:true
  });
  $("status").textContent="MONITOR ONLINE • "+new Date().toLocaleTimeString();
 }catch(e){showError(e)}
}

$("start").onclick=async()=>{
 room=$("room").value.trim();
 if(!roomValid(room)){
  $("status").textContent="Use a Room ID with 5–80 letters, numbers, _ or -.";
  return;
 }
 if(!("geolocation" in navigator)){
  $("status").textContent="This browser does not support GPS location.";
  return;
 }
 started=true;
 try{
  await update(ref(db,base()),{
   active:true,
   emergency:false,
   message:$("message").value.trim(),
   heartbeat:Date.now(),
   updatedAt:Date.now()
  });

  navigator.geolocation.getCurrentPosition(
   publishLocation,
   e=>{$("coords").textContent="GPS unavailable: "+e.message},
   {enableHighAccuracy:true,timeout:20000,maximumAge:0}
  );

  watchId=navigator.geolocation.watchPosition(
   publishLocation,
   e=>{$("coords").textContent="GPS update unavailable: "+e.message},
   {enableHighAccuracy:true,maximumAge:3000,timeout:20000}
  );

  if(beatTimer)clearInterval(beatTimer);
  beatTimer=setInterval(sendHeartbeat,2000);
  await sendHeartbeat();
 }catch(e){started=false;showError(e)}
};

$("sos").onclick=async()=>{
 if(!room){
  room=$("room").value.trim();
  if(!roomValid(room)){
   $("status").textContent="Enter a valid Room ID first.";
   return;
  }
 }
 try{
  await set(ref(db,base()+"/emergency"),true);
  await update(ref(db,base()),{
   active:true,
   emergency:true,
   message:$("message").value.trim()||
    "SOS! I AM IN TROUBLE AND NEED IMMEDIATE HELP.",
   sosAt:Date.now(),
   heartbeat:Date.now()
  });
  $("status").textContent="SOS SENT • Alert page should show the emergency.";
  if(!latestLocation && navigator.geolocation){
   navigator.geolocation.getCurrentPosition(publishLocation,
    e=>{$("coords").textContent="SOS sent; GPS unavailable: "+e.message},
    {enableHighAccuracy:true,timeout:20000,maximumAge:0});
  }
 }catch(e){showError(e)}
};

$("stop").onclick=async()=>{
 started=false;
 if(beatTimer)clearInterval(beatTimer);
 if(locationTimer)clearInterval(locationTimer);
 if(watchId!==null)navigator.geolocation.clearWatch(watchId);
 beatTimer=null;watchId=null;
 if(room){
  try{
   await update(ref(db,base()),{active:false,heartbeat:Date.now()});
   $("status").textContent="MONITOR STOPPED";
  }catch(e){showError(e)}
 }
};
</script>
</body>
</html>
