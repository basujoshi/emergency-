
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BD Danger Alert — Monitor</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0b1020;color:#fff;padding:20px}
main{max-width:520px;margin:20px auto;background:#151d32;padding:24px;border-radius:20px}
h1{color:#ff5151;text-align:center}p{color:#cbd5e1;line-height:1.5}
input,textarea,button{width:100%;padding:14px;margin:7px 0;border-radius:10px;border:1px solid #334155;font-size:16px}
input,textarea{background:#0b1020;color:white}button{border:0;font-weight:bold;cursor:pointer;background:#2563eb;color:white}
.sos{background:#e11d48;font-size:22px;padding:22px}.stop{background:#475569}.status{padding:12px;background:#0b1020;border-radius:10px;overflow-wrap:anywhere}
a{color:#93c5fd}
</style>
</head>
<body>
<main>
<h1>🆘 BD DANGER ALERT</h1>
<p>अपना नाम और एक याद रहने वाला Room ID भरें। जिन लोगों को आपकी alert देखनी है, उन्हें वही Room ID दें।</p>

<input id="person" placeholder="Your name">
<input id="room" placeholder="Room ID (e.g. BD1001)">
<textarea id="message" rows="3">SOS! I AM IN TROUBLE. PLEASE CONTACT ME AND CHECK MY LOCATION.</textarea>

<button id="start">START MONITOR + GPS</button>
<button id="sos" class="sos">🆘 SEND SOS ALERT</button>
<button id="stop" class="stop">STOP MONITOR</button>

<div class="status" id="status">Status: Not started</div>
<p id="location">Location: Not available</p>
<p><a id="map" target="_blank" rel="noopener" hidden>Open my location in Google Maps</a></p>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
 getDatabase, ref, set, update, onDisconnect
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
 apiKey: "AIzaSyBrVJ_vcLjxZMSZOjqUQocWjVf36GQ1bEw",
 authDomain: "king-59c08.firebaseapp.com",
 databaseURL: "https://king-59c08-default-rtdb.firebaseio.com",
 projectId: "king-59c08",
 storageBucket: "king-59c08.firebasestorage.app",
 messagingSenderId: "982382372976",
 appId: "1:982382372976:web:07758531a29fdd966e6cb5",
 measurementId: "G-RQ00W2EW9Q"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const $ = id => document.getElementById(id);
let roomPath = null, watchId = null, heartbeatTimer = null, running = false;
let lastPosition = null;

function getRoom() {
 const room = $("room").value.trim().replace(/[.#$/\[\]]/g, "_");
 if (!room) throw new Error("Please enter a Room ID.");
 return room;
}
function showStatus(text) { $("status").textContent = "Status: " + text; }
function roomRef() { return ref(db, "bdDangerRooms/" + roomPath); }

async function startMonitor() {
 try {
  if (running) return;
  roomPath = getRoom();
  const name = $("person").value.trim() || "Anonymous";
  const base = roomRef();
  running = true;
  showStatus("Connecting to Firebase…");

  await set(base, {
   name, room: roomPath, message: $("message").value.trim(),
   active: true, emergency: false, heartbeat: Date.now(),
   updatedAt: Date.now(), location: null
  });

  await onDisconnect(ref(db, "bdDangerRooms/" + roomPath + "/active"))
   .set(false);

  heartbeatTimer = setInterval(() => {
   if (running && roomPath) {
    update(roomRef(), { heartbeat: Date.now(), updatedAt: Date.now() })
     .catch(e => showStatus("Firebase error: " + e.message));
   }
  }, 3000);

  if ("geolocation" in navigator) {
   watchId = navigator.geolocation.watchPosition(async pos => {
    lastPosition = {
     lat: pos.coords.latitude,
     lng: pos.coords.longitude,
     accuracy: Math.round(pos.coords.accuracy),
     time: Date.now()
    };
    $("location").textContent =
     `GPS: ${lastPosition.lat.toFixed(6)}, ${lastPosition.lng.toFixed(6)} (±${lastPosition.accuracy} m)`;
    $("map").href = `https://www.google.com/maps?q=${lastPosition.lat},${lastPosition.lng}`;
    $("map").hidden = false;
    try { await update(roomRef(), { location: lastPosition, updatedAt: Date.now() }); }
    catch(e) { showStatus("Location update failed: " + e.message); }
   }, err => {
    $("location").textContent = "GPS unavailable: " + err.message;
   }, { enableHighAccuracy:true, maximumAge:5000, timeout:15000 });
  } else {
   $("location").textContent = "This browser does not support GPS.";
  }
  showStatus("Monitoring started — keep this page open.");
 } catch(e) {
  running = false;
  showStatus(e.message);
 }
}

async function sendSOS() {
 try {
  if (!running) await startMonitor();
  if (!running) return;
  await update(roomRef(), {
   name: $("person").value.trim() || "Anonymous",
   message: $("message").value.trim() || "SOS — I NEED HELP",
   emergency: true, sosAt: Date.now(), heartbeat: Date.now(),
   updatedAt: Date.now(),
   ...(lastPosition ? { location: lastPosition } : {})
  });
  showStatus("SOS sent to this Room ID. Contact emergency services too.");
 } catch(e) { showStatus("SOS failed: " + e.message); }
}

async function stopMonitor() {
 running = false;
 if (heartbeatTimer) clearInterval(heartbeatTimer);
 heartbeatTimer = null;
 if (watchId !== null) navigator.geolocation.clearWatch(watchId);
 watchId = null;
 if (roomPath) {
  try { await update(roomRef(), { active:false, updatedAt:Date.now() }); }
  catch(e) { showStatus("Could not update Firebase: " + e.message); return; }
 }
 showStatus("Monitoring stopped.");
}

$("start").addEventListener("click", startMonitor);
$("sos").addEventListener("click", sendSOS);
$("stop").addEventListener("click", stopMonitor);
window.addEventListener("beforeunload", () => {
 if (heartbeatTimer) clearInterval(heartbeatTimer);
 if (watchId !== null) navigator.geolocation.clearWatch(watchId);
});
</script>
</body>
</html>
