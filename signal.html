
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BD DANGER Monitor</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1220;color:white;font:16px Arial;padding:18px}
main{width:min(100%,500px);background:#172033;padding:24px;border-radius:18px;box-sizing:border-box}
button{padding:12px;border:0;border-radius:8px;background:#2563eb;color:white;margin:5px;cursor:pointer}
code,a{overflow-wrap:anywhere;color:#93c5fd}
.status{background:#0b1220;padding:14px;border-radius:10px;line-height:1.8}
</style>
</head>
<body>
<main>
<h1>BD <span style="color:#60a5fa">MONITOR</span></h1>
<p>Worldwide monitoring — no login form.</p>
<div class="status">
<b>Status:</b> <span id="status">Connecting...</span><br>
<b>Room code:</b> <code id="room">Creating...</code><br>
<b>Last heartbeat:</b> <span id="last">—</span>
</div>
<p><b>Alert link for your other device:</b></p>
<a id="alertLink">Preparing link...</a><br>
<button id="copy">Copy Alert Link</button>
<button id="stop" style="background:#b91c1c">Stop Monitor</button>
<button id="resume">Resume Monitor</button>
<p id="msg"></p>
</main>

<script type="module">
import {initializeApp}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {getAuth,signInAnonymously}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {getDatabase,ref,set,serverTimestamp}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBrVJ_vcLjxZMSZOjqUQocWjVf36GQ1bEw",
  authDomain: "king-59c08.firebaseapp.com",
  databaseURL: "https://king-59c08-default-rtdb.firebaseio.com",
  projectId: "king-59c08",
  storageBucket: "king-59c08.firebasestorage.app",
  messagingSenderId: "982382372976",
  appId: "1:982382372976:web:07758531a29fdd966e6cb5",
  measurementId: "G-RQ00W2EW9Q"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);
const $=id=>document.getElementById(id);

function makeRoom(){
  const bytes=new Uint8Array(24);
  crypto.getRandomValues(bytes);
  return Array.from(bytes,b=>b.toString(16).padStart(2,"0")).join("");
}

const roomId=new URLSearchParams(location.search).get("room")||makeRoom();
$("room").textContent=roomId;

const link=new URL("alert.html",location.href);
link.searchParams.set("room",roomId);
$("alertLink").href=link.href;
$("alertLink").textContent=link.href;

let uid=null,seq=0,running=false,timer=null;

async function beat(){
  if(!uid||!running)return;
  const now=Date.now();
  try{
    await set(ref(db,"rooms/"+roomId+"/heartbeat"),{
      clientTime:now,
      serverTime:serverTimestamp(),
      sequence:++seq,
      state:"online",
      sender:uid
    });
    $("status").textContent="ONLINE";
    $("last").textContent=new Date(now).toLocaleTimeString();
  }catch(e){
    $("status").textContent="DATABASE ERROR";
    $("msg").textContent=e.message;
  }
}

function start(){
  if(!uid||running)return;
  running=true;
  beat();
  timer=setInterval(beat,2000);
  $("status").textContent="Starting monitor...";
}

function stop(){
  running=false;
  if(timer)clearInterval(timer);
  timer=null;
  $("status").textContent="STOPPED — alert will time out";
}

$("stop").onclick=stop;
$("resume").onclick=start;

$("copy").onclick=async()=>{
  try{
    await navigator.clipboard.writeText(link.href);
    $("msg").textContent="Alert link copied. Send it privately.";
  }catch(e){
    $("msg").textContent="Select and copy the alert link manually.";
  }
};

try{
  const credential=await signInAnonymously(auth);
  uid=credential.user.uid;
  start();
}catch(e){
  $("status").textContent="CONNECTION FAILED";
  $("msg").textContent=
    "Enable Anonymous Authentication in Firebase. "+e.message;
}

window.addEventListener("pagehide",()=>{
  if(timer)clearInterval(timer);
});
</script>
</body>
</html>
