<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BD Danger Alert Monitor</title><style>*{box-sizing:border-box}body{margin:0;padding:14px;background:#f2f5fa;color:#172033;font:16px Arial}.wrap{max-width:950px;margin:auto}.hero{background:linear-gradient(135deg,#10284b,#155eef);color:white;padding:22px;border-radius:18px}.hero p{color:#dbeafe;line-height:1.5}.card,.room{background:white;border:1px solid #dce3ed;border-radius:15px;padding:17px;margin:13px 0;overflow-wrap:anywhere}label{display:block;font-weight:bold;margin:12px 0 6px}input,textarea,select,button{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}textarea{min-height:80px}button{background:#155eef;color:white;border:0;font-weight:bold;margin-top:9px;cursor:pointer}.secondary{background:#e8eef8;color:#183153}.danger{background:#c62828}.status{padding:12px;background:#eef4ff;border-radius:10px;margin:12px 0;line-height:1.45}.ok{background:#dcfae6;color:#05603a}.err{background:#fee4e2;color:#912018}.warn{background:#fff4d6;color:#854d0e}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.pill{display:inline-block;background:#e8eef8;border-radius:20px;padding:5px 9px;font-size:12px;font-weight:bold}.sos{border:2px solid #d92d20}.map{color:#155eef;font-weight:bold}.muted{font-size:13px;color:#667085;line-height:1.5}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:9px}.stat{background:#f6f8fc;border-radius:10px;padding:12px}.stat strong{display:block;font-size:22px}.stat span{font-size:12px;color:#667085}iframe{max-width:100%;border:0;border-radius:12px}@media(max-width:500px){body{padding:8px}.card,.room{padding:13px}}</style><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script></head><body><main class="wrap"><header class="hero"><span class="pill">BD DANGER ALERT</span><h1>Emergency Monitor</h1><p>Keep this page open for live GPS updates. Share your Room ID only with trusted people.</p></header><section class="card"><div id="status" class="status">Connecting to Firebase…</div><div class="grid"><div><label>Name *</label><input id="name" placeholder="Full name"></div><div><label>Room ID *</label><input id="room" placeholder="Example: BD123"></div></div><div class="grid"><div><label>Phone</label><input id="phone" placeholder="Phone number"></div><div><label>Emergency contact</label><input id="contact" placeholder="Trusted contact number"></div></div><label>Emergency notes</label><textarea id="message" placeholder="Useful emergency information"></textarea><div class="grid"><button id="start">Start monitoring + share GPS</button><button id="sos" class="danger" disabled>SEND SOS</button></div><div class="grid"><button id="resolve" class="secondary" disabled>Resolve SOS</button><button id="stop" class="secondary" disabled>Stop monitoring</button></div><div id="gps" class="status">GPS not started</div><p class="muted">GPS requires HTTPS and browser permission. This is not a replacement for emergency services.</p></section></main><script>
const firebaseConfig = {
 apiKey:"AIzaSyBrVJ_vcLjxZMSZOjqUQocWjVf36GQ1bEw",
 authDomain:"king-59c08.firebaseapp.com",
 databaseURL:"https://king-59c08-default-rtdb.firebaseio.com",
 projectId:"king-59c08",
 storageBucket:"king-59c08.firebasestorage.app",
 messagingSenderId:"982382372976",
 appId:"1:982382372976:web:07758531a29fdd966e6cb5"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

const $=x=>document.getElementById(x);let key=null,watch=null,active=false;
const clean=s=>s.trim().replace(/[.#$\[\]\/]/g,'_').slice(0,80);
function status(t,c=''){$('status').className='status '+c;$('status').textContent=t}
db.ref('.info/connected').on('value',s=>status(s.val()?'Firebase connected ✓':'Firebase disconnected — check internet and Rules',s.val()?'ok':'err'));
$('start').onclick=async()=>{let n=$('name').value.trim(),r=$('room').value.trim();if(!n||!r)return status('Enter name and Room ID.','err');key=clean(r);$('start').disabled=true;let ref=db.ref('bdDangerRooms/'+key);try{let old=(await ref.once('value')).val()||{};await ref.update({roomId:r,name:n,phone:$('phone').value.trim(),emergencyContact:$('contact').value.trim(),message:$('message').value.trim(),active:true,emergency:old.emergency===true,startedAt:firebase.database.ServerValue.TIMESTAMP,updatedAt:firebase.database.ServerValue.TIMESTAMP,schemaVersion:2});active=true;$('sos').disabled=$('resolve').disabled=$('stop').disabled=false;status('Monitoring started. Use the same Room ID on alert.html.','ok');if(!navigator.geolocation){$('gps').textContent='GPS not supported';return}watch=navigator.geolocation.watchPosition(async p=>{let g={latitude:p.coords.latitude,longitude:p.coords.longitude,accuracy:Math.round(p.coords.accuracy||0),gpsAt:Date.now()};$('gps').textContent=`GPS ${g.latitude.toFixed(6)}, ${g.longitude.toFixed(6)} ±${g.accuracy}m`;try{await ref.update({location:g,updatedAt:firebase.database.ServerValue.TIMESTAMP})}catch(e){status('GPS save failed: '+e.message,'err')}},e=>{$('gps').textContent='GPS error: '+e.message+'; allow location permission and use HTTPS'}, {enableHighAccuracy:true,maximumAge:5000,timeout:20000})}catch(e){$('start').disabled=false;status('Start failed: '+e.message+'. Check Firebase Rules/database URL.','err')}};
$('sos').onclick=async()=>{if(!active)return;try{await db.ref('bdDangerRooms/'+key).update({emergency:true,sosAt:firebase.database.ServerValue.TIMESTAMP,updatedAt:firebase.database.ServerValue.TIMESTAMP});status('SOS saved to Firebase.','err')}catch(e){status('SOS failed: '+e.message,'err')}};
$('resolve').onclick=async()=>{if(!key)return;try{await db.ref('bdDangerRooms/'+key).update({emergency:false,resolvedAt:firebase.database.ServerValue.TIMESTAMP,updatedAt:firebase.database.ServerValue.TIMESTAMP});status('SOS marked resolved.','ok')}catch(e){status(e.message,'err')}};
$('stop').onclick=async()=>{if(!key)return;if(watch!==null)navigator.geolocation.clearWatch(watch);try{await db.ref('bdDangerRooms/'+key).update({active:false,stoppedAt:firebase.database.ServerValue.TIMESTAMP,updatedAt:firebase.database.ServerValue.TIMESTAMP})}catch(e){status('Stopped locally; Firebase update failed: '+e.message,'err')}watch=null;active=false;$('start').disabled=false;$('sos').disabled=$('resolve').disabled=$('stop').disabled=true;$('gps').textContent='GPS stopped';status('Monitoring stopped.')};
</script></body></html>
