<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BD Monitor</title></head>
<body style="background:#101827;color:white;font-family:Arial;text-align:center;padding:30px">
<h1>BD MONITOR</h1><p id="status">Starting...</p>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, set, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig = {
apiKey:"AIzaSyBrVJ_vcLjxZMSZOjqUQocWjVf36GQ1bEw",
authDomain:"king-59c08.firebaseapp.com",
databaseURL:"https://king-59c08-default-rtdb.firebaseio.com",
projectId:"king-59c08",
storageBucket:"king-59c08.firebasestorage.app",
messagingSenderId:"982382372976",
appId:"1:982382372976:web:07758531a29fdd966e6cb5"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app);
const email=prompt("Firebase account email"),password=prompt("Firebase account password");
try {
const user=await signInWithEmailAndPassword(auth,email,password);
let n=0;
async function beat(){
try{await set(ref(db,"monitors/"+user.user.uid+"/heartbeat"),{clientTime:Date.now(),serverTime:serverTimestamp(),sequence:++n,state:"online"});document.getElementById("status").textContent="MONITOR ONLINE — "+new Date().toLocaleTimeString();}
catch(e){document.getElementById("status").textContent="ERROR: "+e.message;}
}
await beat();setInterval(beat,2000);
}catch(e){document.getElementById("status").textContent="Login error: "+e.message;}
</script></body></html>
