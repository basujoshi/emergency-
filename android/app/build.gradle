plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.bashurod.bdremote'
    compileSdk 35
    defaultConfig {
        applicationId 'com.bashurod.bdremote'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation('io.socket:socket.io-client:2.1.1') {
        exclude group: 'org.json', module: 'json'
    }
    // Add and pin a maintained Android WebRTC artifact only after selecting
    // and testing the exact SDK; native API versions are not interchangeable.
}
