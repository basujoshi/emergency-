
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BD Danger — Admin Dashboard</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:18px;background:#0b1020;color:white;font-family:Arial,sans-serif}
header{max-width:1000px;margin:auto}h1{color:#ff5555}
input,button{padding:12px;border-radius:9px;font-size:15px;margin:5px 0}
input{background:#151d32;color:white;border:1px solid #475569;width:100%}
button{border:0;background:#2563eb;color:white;cursor:pointer}
#alarm{background:#7c3aed}
#list{max-width:1000px;margin:18px auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}
.card{background:#151d32;border:1px solid #334155;border-radius:14px;padding:17px;overflow-wrap:anywhere}
.card h2{font-size:20px;margin-top:0}
.danger{color:#ff5555;font-weight:bold}.online{color:#4ade80}.offline{color:#fbbf24}
a{color:#93c5fd}small{color:#cbd5e1}
</style>
</head>
<body>
<header>
<h1>🛡️ BD DANGER ADMIN</h1>
<p>Live room monitoring dashboard</p>
<input id="search" placeholder="Search by name or Room ID">
<button id="alarm">ENABLE ADMIN SOUND & NOTIFICATIONS</button>
<div id="status">Connecting to Firebase…</div>
</header>
<div id="list"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
 apiKey: "AIzaSyBrVJ_vcLjxZMSZOjqUQocWjVf36GQ1bEw",
 authDomain: "king-59c08.firebaseapp.com",
 databaseURL: "https://king-59c08-default-rtdb.firebaseio.com",
 projectId: "king-59c08",
 storageBucket: "king-59c08.firebasestorage.app",
 messagingSenderId: "982382372976",
 appId: "1:982382372976:web:07758531a29fdd966e6cb5",
 measurementId: "G-RQ00W2EW9Q"
};
const db = getDatabase(initializeApp(firebaseConfig));
const $ = id => document.getElementById(id);
let rooms = {}, audioCtx = null, notify = false;
const seenSOS = new Set();

$("alarm").onclick = async () => {
 try {
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  await audioCtx.resume();
  if ("Notification" in window)
   notify = await Notification.requestPermission() === "granted";
  $("status").textContent = "Admin alerts enabled. Keep this page open.";
 } catch(e) {
  $("status").textContent = "Could not enable alerts: " + e.message;
 }
};

function beep() {
 if (!audioCtx) return;
 try {
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.frequency.value = 950; g.gain.value = 0.15;
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + 0.7);
 } catch {}
}
function safeText(el, value) { el.textContent = value ?? ""; }

function render() {
 const filter = $("search").value.trim().toLowerCase();
 const list = $("list");
 list.replaceChildren();
 const entries = Object.entries(rooms).filter(([id,d]) =>
  id.toLowerCase().includes(filter) ||
  String(d.name || "").toLowerCase().includes(filter)
 );
 if (!entries.length) {
  list.textContent = "No rooms found. Start monitor.html to create a room.";
  return;
 }
 entries.forEach(([id,d]) => {
  const card = document.createElement("section");
  card.className = "card";
  const title = document.createElement("h2");
  safeText(title, d.name || "Unknown person");
  card.appendChild(title);

  const add = (text, cls) => {
   const p = document.createElement("p");
   p.textContent = text;
   if (cls) p.className = cls;
   card.appendChild(p);
  };
  const alive = d.active === true &&
   typeof d.heartbeat === "number" &&
   Date.now() - d.heartbeat < 15000;

  add("Room ID: " + id);
  add(d.emergency ? "🆘 SOS EMERGENCY" : (alive ? "🟢 MONITOR ACTIVE" : "⚪ INACTIVE / NO RECENT HEARTBEAT"),
      d.emergency ? "danger" : alive ? "online" : "offline");
  add("Message: " + (d.message || "No message"));
  add("Last heartbeat: " + (d.heartbeat ? new Date(d.heartbeat).toLocaleString() : "Unknown"));
  add("Last update: " + (d.updatedAt ? new Date(d.updatedAt).toLocaleString() : "Unknown"));

  if (d.location && Number.isFinite(d.location.lat) && Number.isFinite(d.location.lng)) {
   add("GPS: " + d.location.lat + ", " + d.location.lng);
   const a = document.createElement("a");
   a.href = `https://www.google.com/maps?q=${d.location.lat},${d.location.lng}`;
   a.target = "_blank";
   a.rel = "noopener";
   a.textContent = "Open Google Maps";
   card.appendChild(a);
  } else add("GPS: Not available");

  list.appendChild(card);
 });
}

onValue(ref(db, "bdDangerRooms"), snap => {
 rooms = snap.val() || {};
 $("status").textContent = "Connected. Rooms found: " + Object.keys(rooms).length;
 for (const [id,d] of Object.entries(rooms)) {
  if (d && d.emergency === true && d.sosAt && !seenSOS.has(id + ":" + d.sosAt)) {
   seenSOS.add(id + ":" + d.sosAt);
   beep();
   if (notify && "Notification" in window) {
    new Notification("BD DANGER SOS", {
     body: (d.name || id) + " sent an SOS alert."
    });
   }
  }
 }
 render();
}, error => {
 $("status").textContent = "Firebase error: " + error.message +
  " Check Realtime Database Rules and project configuration.";
});

$("search").addEventListener("input", render);
</script>
</body>
</html>
