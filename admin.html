
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BD Danger Admin</title>
<style>
body{margin:0;padding:16px;background:#080e19;color:white;font-family:Arial}
main{max-width:1100px;margin:auto}
h1{color:#fb7185}
input,select,button{padding:12px;border-radius:9px;margin:5px 0;font-size:15px}
input,select{background:#121d30;color:white;border:1px solid #344760}
button{background:#4f46e5;color:white;border:0;font-weight:bold}
#rooms{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:16px}
.card{background:#121d30;border:1px solid #334155;border-radius:14px;padding:16px;overflow-wrap:anywhere}
.sos{border:2px solid #ef4444;background:#35131d}
.label{color:#94a3b8;font-size:12px;margin-top:12px}
.value{margin-top:5px;white-space:pre-wrap}
a{color:#93c5fd}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:#172338;border-radius:10px;padding:13px;flex:1;min-width:100px}
</style>
</head>
<body>
<main>
<h1>🛡️ BD DANGER ADMIN</h1>
<p id="status">Connecting to Firebase...</p>
<div class="stats">
 <div class="stat">TOTAL ROOMS <h2 id="total">0</h2></div>
 <div class="stat">ACTIVE <h2 id="active">0</h2></div>
 <div class="stat">SOS ALERTS <h2 id="soscount">0</h2></div>
</div>
<input id="search" placeholder="Search name, room or phone">
<select id="filter">
<option value="all">All rooms</option>
<option value="sos">SOS only</option>
<option value="active">Active</option>
<option value="inactive">Inactive / stale</option>
</select>
<button id="sound">ENABLE SOUND & NOTIFICATIONS</button>
<div id="rooms"></div>
<p style="color:#94a3b8;font-size:12px">
Keep this page open for live alerts. Open database rules expose personal data;
use these rules for testing only, not for real sensitive information.
</p>
</main>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getDatabase,ref,onValue}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig={
apiKey:"AIzaSyBrVJ_vcLjxZMSZOjqUQocWjVf36GQ1bEw",
authDomain:"king-59c08.firebaseapp.com",
databaseURL:"https://king-59c08-default-rtdb.firebaseio.com",
projectId:"king-59c08",
storageBucket:"king-59c08.firebasestorage.app",
messagingSenderId:"982382372976",
appId:"1:982382372976:web:07758531a29fdd966e6cb5",
measurementId:"G-RQ00W2EW9Q"
};

const db=getDatabase(initializeApp(firebaseConfig));
const $=id=>document.getElementById(id);
let rooms={},audio=null,notifications=false;
const seen=new Set();

$("sound").onclick=async()=>{
 try{
  audio=audio||new(window.AudioContext||window.webkitAudioContext)();
  await audio.resume();
  if("Notification"in window)
   notifications=await Notification.requestPermission()==="granted";
  $("status").textContent="Sound enabled. Keep Admin open.";
 }catch(e){$("status").textContent=e.message}
};

function beep(){
 if(!audio)return;
 try{
  const o=audio.createOscillator(),g=audio.createGain();
  o.frequency.value=950;g.gain.value=.15;
  o.connect(g);g.connect(audio.destination);
  o.start();o.stop(audio.currentTime+.7);
 }catch{}
}

function add(card,label,value){
 const l=document.createElement("div");
 l.className="label";l.textContent=label;card.append(l);
 const v=document.createElement("div");
 v.className="value";v.textContent=value??"Not provided";
 card.append(v);
}

function render(){
 const q=$("search").value.trim().toLowerCase();
 const filter=$("filter").value;
 const list=Object.entries(rooms).filter(([id,d])=>{
  d=d||{};
  const alive=d.active===true&&d.heartbeat&&Date.now()-d.heartbeat<15000;
  if(filter==="sos"&&!d.emergency)return false;
  if(filter==="active"&&!alive)return false;
  if(filter==="inactive"&&alive)return false;
  return [id,d.name,d.phone].some(v=>String(v||"").toLowerCase().includes(q));
 }).sort((a,b)=>
  Number(!!b[1].emergency)-Number(!!a[1].emergency)||
  (b[1].sosAt||b[1].updatedAt||0)-(a[1].sosAt||a[1].updatedAt||0)
 );

 const box=$("rooms");box.replaceChildren();
 if(!list.length){box.textContent="No rooms found yet.";return}

 for(const [id,d0] of list){
  const d=d0||{};
  const alive=d.active===true&&d.heartbeat&&Date.now()-d.heartbeat<15000;
  const c=document.createElement("section");
  c.className="card"+(d.emergency?" sos":"");
  const title=document.createElement("h2");
  title.textContent=d.name||"Name not provided";c.append(title);
  const badge=document.createElement("b");
  badge.textContent=d.emergency?"🆘 SOS ALERT":alive?"🟢 ACTIVE":"⚪ INACTIVE / STALE";
  c.append(badge);

  add(c,"Room ID",id);
  add(c,"Phone",d.phone);
  add(c,"Emergency contact",d.emergencyContact);
  add(c,"Emergency message",d.message);
  add(c,"SOS time",d.sosAt?new Date(d.sosAt).toLocaleString():"No SOS recorded");
  add(c,"Last heartbeat",d.heartbeat?new Date(d.heartbeat).toLocaleString():"Unknown");
  add(c,"Last update",d.updatedAt?new Date(d.updatedAt).toLocaleString():"Unknown");

  const loc=d.location;
  add(c,"GPS coordinates",loc?`${loc.lat}, ${loc.lng}`:"Location unavailable");
  add(c,"GPS accuracy",loc&&loc.accuracy!=null?`±${loc.accuracy} metres`:"Not available");
  add(c,"Location time",loc&&loc.time?new Date(loc.time).toLocaleString():"Not available");

  if(loc&&Number.isFinite(Number(loc.lat))&&Number.isFinite(Number(loc.lng))){
   const a=document.createElement("a");
   a.href=`https://www.google.com/maps?q=${loc.lat},${loc.lng}`;
   a.target="_blank";a.rel="noopener";a.textContent="📍 OPEN GPS LOCATION";
   c.append(a);
  }
  box.append(c);
 }
}

onValue(ref(db,"bdDangerRooms"),snap=>{
 rooms=snap.val()||{};
 const entries=Object.entries(rooms);
 let active=0,sos=0;

 for(const [id,d] of entries){
  if(!d)continue;
  if(d.active===true&&d.heartbeat&&Date.now()-d.heartbeat<15000)active++;
  if(d.emergency===true)sos++;
  if(d.emergency===true&&d.sosAt&&!seen.has(id+":"+d.sosAt)){
   seen.add(id+":"+d.sosAt);
   beep();
   if(notifications&&"Notification"in window)
    new Notification("BD DANGER SOS",{body:(d.name||id)+" sent an SOS alert"});
  }
 }
 $("total").textContent=entries.length;
 $("active").textContent=active;
 $("soscount").textContent=sos;
 $("status").textContent="Live Firebase connection • "+new Date().toLocaleTimeString();
 render();
},e=>{
 $("status").textContent="Firebase error: "+e.message+
 " — check Realtime Database rules.";
});

$("search").oninput=render;
$("filter").onchange=render;
setInterval(render,5000);
</script>
</body>
</html>
